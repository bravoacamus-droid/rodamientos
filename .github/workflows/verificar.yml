name: Verificar

on:
  push:
    branches: [main, "v2/**"]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lo primero porque es lo más barato —lee nombres de archivo, no abre
      # ninguna conexión— y porque lo que comprueba no lo puede ver ninguno de
      # los pasos siguientes: dos migraciones con el mismo número compilan,
      # pasan el lint y pasan los tests. Se aplican por nombre y una sola vez,
      # así que una de las dos se quedaría fuera sin dar error.
      - name: Revisar la numeración de las migraciones
        run: pnpm db:revisar

      - name: Comprobar tipos
        run: pnpm typecheck

      # Va aquí y no al final porque es lo más rápido de los tres y lo que
      # antes falla: si hay un gancho mal llamado o una variable muerta, mejor
      # saberlo en veinte segundos que después de un build de un minuto.
      - name: Lint
        run: pnpm lint

      - name: Tests unitarios
        run: pnpm test

      # El build necesita las variables públicas de Supabase declaradas, no
      # que apunten a ningún sitio: ninguna página se prerenderiza contra la
      # base, así que compila igual con valores de relleno. Y eso es lo que
      # queremos aquí — un CI que puede salir en rojo porque falta un secret
      # miente sobre el código, que es lo único que este paso mira. Con el
      # relleno, rojo significa que hay un fallo de verdad.
      #
      # Si el secret existe se usa, para que el build de `main` sea el mismo
      # que se despliega. Un fork o un PR desde fuera no tiene secrets y
      # compila igual.
      #
      # Lo que este paso NO comprueba es que las credenciales de Vercel sean
      # correctas. Nunca lo comprobó: usaba las suyas.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-sin-proyecto.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'clave-de-relleno-solo-para-compilar' }}
